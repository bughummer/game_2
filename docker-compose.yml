version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: http://10.0.139.93:8080
        https_proxy: http://10.0.139.93:8080
    image: ml_factory_app
    container_name: ml_factory_app
    ports:
      - "7503:8000"
    # Copy infra/server/ml-factory.env.example to .env.docker and fill it in (git ignores it).
    env_file: .env.docker
    environment:
      - http_proxy=http://10.0.139.93:8080
      - https_proxy=http://10.0.139.93:8080
      - NO_PROXY=localhost,127.0.0.1
      - ML_FACTORY_AGENT_ENABLED=true
      # The AWS profile named in .env.docker (ML_FACTORY_AWS_PROFILE) is read from /aws.
      - AWS_CONFIG_FILE=/aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - dev_network
    volumes:
      - ${USERPROFILE:-${HOME}}/.aws:/aws:ro

networks:
  dev_network:
    external: true
